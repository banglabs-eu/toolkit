# focus.bang-labs.eu — a handful of static files behind the Cloudflare Tunnel.
#
# Port 8016: 8014 is backend.toolkit prod and 8015 is reserved for its dev env
# (see backend.toolkit/.env.example), so the two can never collide on this box.
server {
    listen 8016;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # One page and its modules. Anything else lands on the terminal rather
    # than an nginx 404 — there are no other routes to get wrong.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The page is small and changes with every deploy, so revalidate rather
    # than cache: a 304 costs nothing and a stale module costs an afternoon.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache" always;
    }

    # It talks to two Bang Labs services and loads one font; nothing else is
    # allowed to reach the network from here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://accounts.bang-labs.eu https://toolkit.bang-labs.eu; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The tunnel answers this without troubling the tunnel's own health.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
