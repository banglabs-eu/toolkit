[package]
name = "cosmic-clean-usb"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "COSMIC desktop app for managing USB drives — wipe, format, and benchmark"
repository = "https://github.com/AdamBK/cosmic-clean-usb"

[[bin]]
name = "cosmic-clean-usb"
path = "src/main.rs"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", default-features = false, features = ["tokio", "winit", "wgpu"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
