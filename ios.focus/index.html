<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>focus — iOS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-view-mode="fullscreen">
  <div class="ios-app-wrapper">
    
    <!-- iOS Status Bar & Dynamic Island -->
    <header class="ios-status-bar">
      <div class="status-left">
        <span id="ios-clock-time">09:41</span>
      </div>
      
      <!-- Dynamic Island / Live Activity Capsule -->
      <div class="dynamic-island" id="dynamic-island" title="Tap to expand Live Activity">
        <div class="di-collapsed">
          <span class="di-icon">⏱️</span>
          <span class="di-timer" id="la-timer">25:00</span>
        </div>
        <div class="di-expanded">
          <div class="di-expanded-row">
            <span class="di-expanded-title" id="la-goal">Deep Work</span>
            <span class="di-expanded-badge">LIVE</span>
          </div>
          <div class="di-progress-track">
            <div class="di-progress-fill" id="la-progress-bar" style="width: 0%;"></div>
          </div>
        </div>
      </div>

      <div class="status-right">
        <span class="icon-wifi">📶</span>
        <span class="icon-battery">🔋</span>
      </div>
    </header>

    <!-- iOS Mode Switcher & Top Toolbar -->
    <nav class="ios-top-nav">
      <div class="mode-pills">
        <button class="mode-pill active" data-mode="fullscreen">Full Screen</button>
        <button class="mode-pill" data-mode="small">Small 2x2</button>
        <button class="mode-pill" data-mode="medium">Medium 4x2</button>
        <button class="mode-pill" data-mode="large">Large 4x4</button>
        <button class="mode-pill" data-mode="lockscreen">Lock Screen</button>
      </div>
      <button class="icon-btn" id="btn-rotate" title="Rotate orientation">🔄</button>
    </nav>

    <!-- Main Workspace Container -->
    <main class="ios-main-container">
      
      <!-- Fullscreen Terminal Canvas Container -->
      <div class="screen-view" id="screen-view">
        <div id="terminal" tabindex="0"></div>
      </div>

      <!-- iOS Widget Simulator View Modes -->
      <div class="widgets-view-container" id="widgets-view-container">
        
        <!-- Small Widget (2x2) -->
        <div class="ios-widget-card widget-small" id="card-small">
          <div class="widget-header">
            <span class="widget-app-icon">⏱️</span>
            <span class="widget-app-name">Focus</span>
            <span class="widget-glyph" id="widget-sm-glyph">⚓</span>
          </div>
          <div class="widget-body">
            <div class="widget-timer" id="widget-sm-time">25:00</div>
            <div class="widget-goal" id="widget-sm-goal">Goal: Deep Work</div>
          </div>
        </div>

        <!-- Medium Widget (4x2) -->
        <div class="ios-widget-card widget-medium" id="card-medium">
          <div class="widget-header">
            <div class="header-left">
              <span class="widget-app-icon">⏱️</span>
              <span class="widget-app-name">Focus</span>
              <span class="widget-tag" id="widget-md-theme">matrix</span>
            </div>
            <span class="widget-status">Running</span>
          </div>
          <div class="widget-body row">
            <div class="col-main">
              <div class="widget-timer" id="widget-md-time">25:00</div>
              <div class="widget-goal" id="widget-md-goal">Goal: Deep Work</div>
              <div class="widget-progress-container">
                <div class="widget-progress-fill" id="widget-md-progress" style="width: 0%;"></div>
              </div>
            </div>
            <div class="col-actions">
              <button class="widget-btn-play" id="w-btn-play">⏯️</button>
            </div>
          </div>
        </div>

        <!-- Large Widget (4x4) -->
        <div class="ios-widget-card widget-large" id="card-large">
          <div class="widget-header">
            <span class="widget-app-icon">⏱️</span>
            <span class="widget-app-name">Focus Pomodoro</span>
            <span class="widget-tag" id="widget-lg-theme">Theme: matrix</span>
          </div>
          <div class="widget-body">
            <div class="widget-lg-clock-box">
              <div class="widget-lg-timer" id="widget-lg-time">25:00</div>
              <div class="widget-lg-pct" id="widget-lg-pct">0% completed</div>
            </div>
            <div class="widget-goal-lg" id="widget-lg-goal">Goal: Deep Work</div>
            <div class="widget-progress-container">
              <div class="widget-progress-fill" id="widget-lg-progress" style="width: 0%;"></div>
            </div>
            <div class="widget-lg-controls">
              <button class="widget-chip" id="w-lg-pause">Space (Pause)</button>
              <button class="widget-chip" id="w-lg-theme">Theme (t)</button>
              <button class="widget-chip" id="w-lg-stop">Stop (q)</button>
            </div>
          </div>
        </div>

        <!-- Lock Screen Widget -->
        <div class="ios-widget-card widget-lockscreen" id="card-lockscreen">
          <div class="lockscreen-ring">
            <span class="ls-icon">⏱️</span>
            <span class="ls-time" id="widget-ls-time">25:00</span>
          </div>
          <div class="ls-text">
            <span class="ls-goal" id="widget-ls-goal">Deep Work</span>
            <span class="ls-sub">iOS Lock Screen Widget</span>
          </div>
        </div>

      </div>
    </main>

    <!-- Touch Terminal Keyboard Action Chips Bar -->
    <div class="ios-touch-toolbar" id="touch-toolbar">
      <div class="chips-scroll">
        <button class="chip" data-cmd="focus ">focus</button>
        <button class="chip" data-cmd="-m 25 ">-m 25</button>
        <button class="chip" data-cmd="-m 50 ">-m 50</button>
        <button class="chip" data-cmd="-t aquarium ">aquarium</button>
        <button class="chip" data-cmd="-t matrix ">matrix</button>
        <button class="chip" data-cmd="-t rain ">rain</button>
        <button class="chip" data-cmd="--log">--log</button>
        <button class="chip" data-cmd="--history">--history</button>
        <button class="chip" data-cmd="--help">--help</button>
        <button class="chip" data-cmd="clear">clear</button>
      </div>
    </div>

    <!-- Floating iOS Quick Control Action Bar -->
    <footer class="ios-action-bar">
      <button class="action-btn" id="ab-play" title="Play / Pause (Space)">
        <span class="icon">⏯️</span>
        <span class="label">Pause</span>
      </button>
      <button class="action-btn" id="ab-theme" title="Theme Picker Modal">
        <span class="icon">🎨</span>
        <span class="label">Theme</span>
      </button>
      <button class="action-btn" id="ab-duration" title="Quick Goal Prompt">
        <span class="icon">🎯</span>
        <span class="label">Goal</span>
      </button>
      <button class="action-btn" id="ab-view" title="Toggle Fullscreen / Widget">
        <span class="icon">📱</span>
        <span class="label">Widget</span>
      </button>
      <button class="action-btn" id="ab-sound" title="Toggle Sound / Audio">
        <span class="icon" id="sound-icon">🔊</span>
        <span class="label">Sound</span>
      </button>
    </footer>

    <!-- iOS Home Indicator Bar -->
    <div class="ios-home-indicator"></div>
  </div>

  <!-- iOS Scene Picker Modal -->
  <div class="ios-modal-overlay" id="scene-modal">
    <div class="ios-modal">
      <div class="modal-header">
        <h3>Choose Focus Scene</h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="scene-grid" id="scene-grid">
        <!-- Dynamically populated scene cards -->
      </div>
      <div class="modal-footer">
        <button class="btn-primary" id="btn-set-default">Set as Default (d)</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
